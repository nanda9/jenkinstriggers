name: Build WF test on main branch
on:
  push:
    branches:
      - main

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Maven Build
        run: mvn clean install




  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Maven Tests on main branch
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle