name: Build WF test on bugfix902 branch
on:
  schedule:
    - cron: '10 10 * * 1-5'
  
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  permissions:
    contents: read
    pull-requests: write


jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code on main branch
        uses: actions/checkout@v7
        with:
          fetch_depth: 0

      - name: Maven Build
        run: mvn clean install

      - name: Upload Build Artifact (WAR)
        uses: actions/upload-artifact@v3
        with:
          name: vprofile-app
          path: target/*.war




  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch_depth: 0

      - name: Run Maven Tests on main branch
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle
