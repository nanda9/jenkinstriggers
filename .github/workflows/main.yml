name: Build WF
on:
  push:
    branches:
      - master

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v40

      - name: Maven Build
        run: maven clean install




  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Maven Tests on main branch
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle