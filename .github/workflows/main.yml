name: Build WF test on bugfix902 branch
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


  schedule:
    - cron: '08 10 * * 1-5'

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code on main branch
        uses: actions/checkout@v7
        with:
          fetch_depth: 0

      - name: Maven Build
        run: mvn clean install




  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch_depth: 0

      - name: Run Maven Tests on main branch
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle
